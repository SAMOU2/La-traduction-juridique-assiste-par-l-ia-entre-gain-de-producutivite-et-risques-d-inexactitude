# Fabrique l'installeur de l'application pour Windows (fichier .msi) sur une machine Windows de GitHub.
#
# La fabrication démarre toute seule quand l'application ou l'installeur change sur la branche principale
# ou sur une branche de travail. Elle peut aussi être lancée à la main : onglet « Actions » du dépôt,
# « Installeur Windows », bouton « Run workflow ».
#
# Tout le travail est fait par deux scripts du projet, qui fonctionnent aussi sur un ordinateur Windows :
#   outils/installeur/construire.py   fabrique l'installeur, puis l'essaie (installation, contrôle de
#                                     l'application installée, désinstallation, mise à jour) ;
#   outils/installeur/publier.py      publie l'installeur sur la page « Releases » du dépôt.
name: Installeur Windows

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'traducteur/**'
      - 'donnees/**'
      - 'main.py'
      - 'outils/installeur/**'
      - '.github/workflows/installeur.yml'
  workflow_dispatch:

permissions:
  contents: write  # pour publier l'installeur sur la page « Releases »

concurrency:
  group: installeur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installeur:
    name: Fabriquer, essayer et publier l'installeur
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Le projet est copié dans un dossier au chemin court. Le nom du dépôt est long : dans le dossier
      # habituel de GitHub, les chemins dépasseraient la limite de Windows (260 caractères).
      - name: Récupérer le projet
        shell: bash
        env:
          JETON: ${{ github.token }}
        run: |
          projet="$RUNNER_TEMP/tj"
          git init --quiet "$projet"
          cd "$projet"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          acces="$(printf 'x-access-token:%s' "$JETON" | base64 --wrap=0)"
          git -c "http.extraheader=AUTHORIZATION: basic $acces" fetch --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          echo "PROJET=$(cygpath --windows "$projet")" >> "$GITHUB_ENV"
          git log -1 --format='Commit %h : %s'

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64

      - name: Installer les outils de fabrication
        working-directory: ${{ env.PROJET }}
        run: python -m pip install --disable-pip-version-check -r outils/installeur/requirements.txt

      - name: Fabriquer l'installeur et l'essayer
        working-directory: ${{ env.PROJET }}
        run: python outils/installeur/construire.py --essayer-l-installation

      # Étape temporaire, le temps de la mise au point : elle dépose les images du contrôle là où elles
      # peuvent être relues à distance. Elle sera retirée.
      - name: Diagnostic temporaire (images du contrôle)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$PROJET/build/installeur/controles" || exit 0
          for image in installe/fenetre.png installe/demarrage.png; do
            [ -f "$image" ] || continue
            base64 --wrap=0 "$image" > contenu.b64
            jq -n --rawfile contenu contenu.b64 '{content: $contenu, encoding: "base64"}' > corps.json
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input corps.json --jq .sha)"
            echo "::notice title=Image $image::$sha"
          done
          rm -f contenu.b64 corps.json

      - name: Garder l'installeur avec la fabrication
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PROJET }}/build/installeur/*.msi
          archive: false
          if-no-files-found: error

      - name: Garder les journaux
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: journaux
          path: |
            ${{ env.PROJET }}/build/installeur/journaux/
            ${{ env.PROJET }}/build/installeur/controles/
            ${{ env.PROJET }}/build/installeur/resume.md
          if-no-files-found: ignore

      - name: Publier l'installeur
        working-directory: ${{ env.PROJET }}
        run: python outils/installeur/publier.py
        env:
          GH_TOKEN: ${{ github.token }}
